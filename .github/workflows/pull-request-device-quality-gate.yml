name: Device Pull Request Quality Gate

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/pull-request-device-quality-gate.yml"

jobs:
  device-quality-gate:
    name: device-quality-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo config validation
        run: npx expo config --type public > /dev/null

      - name: Tests
        run: npm run test

      - name: Coverage (enforced)
        run: npm run coverage

      - name: Typecheck (quality-gate scoped)
        run: npm run typecheck

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-coverage
          path: app/coverage
