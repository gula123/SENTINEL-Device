name: Android Internal Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-submit-internal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        env:
          EXPO_PUBLIC_API_URL: https://api.gulasensei.hu/api
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode Android upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "ANDROID_UPLOAD_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          KEYSTORE_PATH="$GITHUB_WORKSPACE/app/android/app/upload-keystore.jks"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      - name: Create keystore.properties
        env:
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          KEYSTORE_PROPS_PATH="$GITHUB_WORKSPACE/app/android/keystore.properties"
          mkdir -p "$(dirname "$KEYSTORE_PROPS_PATH")"
          cat > "$KEYSTORE_PROPS_PATH" <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_UPLOAD_STORE_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          EOF

      - name: Build Android app bundle (AAB)
        env:
          EXPO_PUBLIC_API_URL: https://api.gulasensei.hu/api
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play Internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: hu.gurul.health.app
          releaseFiles: app/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
